        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

<script>
var data={},grandFam=0,grandPer=0;
layer_NumberofAffectedPersons_3.eachLayer(function(l){
let p=l.feature.properties.ADM2_EN||'';
let m=l.feature.properties.ADM3_EN||'';
let f=Number(l.feature.properties.Families||0);
let pe=Number(l.feature.properties.Persons||0);
if(!data[p])data[p]={};
if(!data[p][m])data[p][m]={fam:0,per:0};
data[p][m].fam+=f;data[p][m].per+=pe;
grandFam+=f;grandPer+=pe;
});
let html='<tr><th>Province</th><th>Municipality</th><th>Families</th><th>Persons</th></tr>';
Object.keys(data).sort().forEach(p=>{let pf=0,pp=0;Object.keys(data[p]).sort().forEach(m=>{pf+=data[p][m].fam;pp+=data[p][m].per;html+=`<tr><td>${p}</td><td>${m}</td><td>${data[p][m].fam.toLocaleString()}</td><td>${data[p][m].per.toLocaleString()}</td></tr>`});html+=`<tr class="provinceTotal"><td colspan="2">TOTAL ${p}</td><td>${pf.toLocaleString()}</td><td>${pp.toLocaleString()}</td></tr>`});
html+=`<tr class="grandTotal"><td colspan="2">GRAND TOTAL</td><td>${grandFam.toLocaleString()}</td><td>${grandPer.toLocaleString()}</td></tr>`;
document.getElementById('munTable').innerHTML=html;
</script>
